name: 'CI'

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # `npm run build` = lint:hooks (React hook-order guard) -> tsc -> vite build
      - run: npm run build

  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # `tauri::generate_context!()` in src/lib.rs:70 embeds `frontendDist`
      # (`../dist`) at compile time and panics if it is missing, so the frontend
      # has to be built before cargo can even type-check the crate.
      - run: npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # `#[cfg(target_os = "windows")]` code is never compiled by the macOS/Linux
  # legs, so a broken Windows-only path only surfaces in the 7-minute release
  # build — v0.2.21 shipped a non-Send future in `auto_fix_health_check`
  # (system.rs) that only Windows CI caught. Type-checking the Windows target
  # from a Linux runner is cheap and needs no linker.
  windows-typecheck:
    name: Windows typecheck (cross, no link)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: windows-typecheck

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      # `tauri-build` compiles a Windows resource file through tauri-winres,
      # which shells out to `llvm-rc`. `cargo check` never links, so a stub that
      # just creates the .res file is enough to get the crate type-checked.
      - name: Stub llvm-rc
        run: |
          mkdir -p "$RUNNER_TEMP/rcshim"
          cat > "$RUNNER_TEMP/rcshim/llvm-rc" <<'SH'
          #!/bin/sh
          out=""; prev=""
          for a in "$@"; do
            case "$prev" in /fo|/FO) out="$a" ;; esac
            prev="$a"
          done
          [ -n "$out" ] && : > "$out"
          exit 0
          SH
          chmod +x "$RUNNER_TEMP/rcshim/llvm-rc"
          echo "$RUNNER_TEMP/rcshim" >> "$GITHUB_PATH"

      - name: cargo check (windows target)
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-msvc --all-targets
