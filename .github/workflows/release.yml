name: 'Release EnvHub'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.get_version.outputs.version }}
          releaseName: 'EnvHub ${{ steps.get_version.outputs.version }}'
          releaseBody: |
            🚀 **EnvHub - 跨平台极速开发环境与版本管理套件**

            ### 📦 下载对应系统安装包：
            - 🍏 **macOS (Universal 架构 - 同时兼容 Apple Silicon M系列与 Intel 芯片)**: `*.dmg`
            - 🪟 **Windows (x64)**: `*.msi` / `*.exe`
            - 🐧 **Linux (x64)**: `*.AppImage` / `*.deb`

            ---

            ### ⚠️ macOS 提示「已损坏，无法打开」解决办法：
            由于开源客户端未购买 Apple 商业签名证书，首次从浏览器下载安装后 macOS Gatekeeper 会提示已损坏拦截。
            请将软件拖入「应用程序」后，打开系统「终端 (Terminal)」，粘贴并执行以下命令即可正常秒开：
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/EnvHub.app
            ```

            ---

            ### ✨ 核心功能亮点：
            - ⚡ **多语言极速管理（18 种主流语言）**：Node.js、Python、Go、Rust、Java、Ruby、Bun、Deno、PHP、Zig、.NET、Dart、Flutter、Kotlin、Elixir、Erlang、Lua、Terraform
            - 🛠️ **系统核心与数据库**：Git, Docker, Docker Compose, Nginx, Redis, MySQL, PostgreSQL, MongoDB, Ollama, gh, ripgrep, fd, lazygit 等
            - 🌐 **国内镜像源高速测速**：NPM / Pip / Cargo / GoProxy / Docker Hub / Maven / Composer / RubyGems 一键加速
            - 🩺 **环境健康诊断**：实时排查并一键自动修复终端 Shell RC 与 Shims PATH
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
